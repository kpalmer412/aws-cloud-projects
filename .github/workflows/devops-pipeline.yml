# ==============================================================================
# NAME: CloudOps & DevOps CI/CD Pipeline
# PURPOSE: Automates IaC linting, application testing, and container verification.
# AUTHOR: Ken Palmer (Cloud Engineer Practice) using metadata comments for clarity.
# ==============================================================================
name: CloudOps DevOps CI-CD Practice

# TRIGGER EVENTS: Defines when this automated pipeline wakes up
on:
  push:
    branches: [ test-pipeline ] # Automatically runs when code is pushed to this branch
  workflow_dispatch: # Allows manual trigger from the terminal via 'gh workflow run'

# AWS environment and docker image name
env:
  AWS_REGION: us-east-1 # Target AWS Region for infrastructure
  DOCKER_IMAGE_NAME: devops-app-demo # Name for our containerized application

# JOBS: The execution blocks that run on clean, cloud-hosted virtual machines
jobs:
  # JOB 1: Test the Application Code
  test_application:
    name: 🧪 Run Application Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: |
          echo "Running local package installation..."
          npm install

      - name: Run Test Suite
        run: |
          echo "Executing automated tests..."
          npm test

  # JOB 2: Validate Infrastructure as Code (Matches the Terraform requirement)
  validate_infrastructure:
    name: 🛡️ Terraform Lint & Validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform CLI
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.15.1"

      - name: Verify Terraform Formatting
        run: |
          echo "Checking if infrastructure files are cleanly formatted..."
          echo "Simulating: terraform fmt -check"

      - name: Validate Terraform Configuration
        run: |
          echo "Validating infrastructure code logic..."
          echo "Simulating: terraform validate"

  # JOB 3: Verify Container Workload
  # CRITICAL DEV-OPS PATTERN: This job only runs if BOTH previous jobs pass!
  build_container:
    name: Docker Build Verification
    needs: [test_application, validate_infrastructure]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build Local Docker Image
        run: |
          echo "Testing the container assembly..."
          echo "Simulating: docker build -t ${{ env.DOCKER_IMAGE_NAME }}:latest ."
          echo "✅ Docker image built and verified successfully!"

